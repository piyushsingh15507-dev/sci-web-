<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>503 Service Temporarily Unavailable</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:#fafafa;color:#202124;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;
  }
  .wrap{max-width:480px;text-align:center;}
  .icon{font-size:56px;margin-bottom:18px;opacity:0.55;}
  h1{font-size:22px;font-weight:500;margin-bottom:10px;color:#202124;}
  p{font-size:14px;line-height:1.6;color:#5f6368;margin-bottom:6px;}
  .code{font-size:12px;color:#9aa0a6;margin-top:28px;font-family:monospace;letter-spacing:.03em;}
  .retry{margin-top:24px;}
  .retry button{
    background:#fff;border:1px solid #dadce0;color:#3c4043;padding:9px 22px;border-radius:4px;
    font-size:13.5px;cursor:pointer;font-family:inherit;
  }
  .retry button:hover{background:#f8f9fa;box-shadow:0 1px 2px rgba(0,0,0,0.1);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">⚠️</div>
    <h1>503 Service Temporarily Unavailable</h1>
    <p>The server is currently unable to handle this request due to scheduled maintenance.</p>
    <p>Please try again in a little while.</p>
    <div class="retry"><button onclick="window.location.reload()">Retry</button></div>
    <div class="code">Error 503 — Service Unavailable</div>
  </div>
</body>
</html>
