<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Test Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  :root{ --auth-blue:#4f6cf7; --auth-purple:#8b5cf6; --auth-pink:#ec4899; }
  body{
    display:flex;align-items:center;justify-content:center;min-height:100vh;
    padding:20px;font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#3b3fd6 0%,#6d3fd6 45%,#c23fd6 100%);
    position:relative; overflow:hidden;
  }
  .blob{ position:absolute; border-radius:50%; filter:blur(60px); opacity:.55; z-index:0; }
  .blob1{ width:420px;height:420px; background:var(--auth-pink); top:-120px; left:-100px; animation:float1 11s ease-in-out infinite; }
  .blob2{ width:380px;height:380px; background:var(--auth-blue); bottom:-140px; right:-100px; animation:float2 13s ease-in-out infinite; }
  .blob3{ width:260px;height:260px; background:#22d3ee; top:40%; right:8%; animation:float3 9s ease-in-out infinite; }
  @keyframes float1{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(40px,50px) scale(1.08); } }
  @keyframes float2{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-35px,-30px) scale(1.1); } }
  @keyframes float3{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-25px,35px); } }

  @keyframes cardIn{ from{ opacity:0; transform:translateY(28px) scale(.96); } to{ opacity:1; transform:translateY(0) scale(1); } }
  .auth-card{
    position:relative; z-index:1;
    background:rgba(255,255,255,0.97); backdrop-filter:blur(6px);
    border-radius:22px;max-width:420px;width:100%;padding:36px 32px;
    box-shadow:0 30px 70px rgba(20,10,60,0.35);
    animation:cardIn .6s cubic-bezier(.2,.8,.2,1) both;
  }
  .auth-card h1{
    margin:0 0 4px;font-size:24px;font-weight:800;
    background:linear-gradient(135deg,var(--auth-blue),var(--auth-purple),var(--auth-pink));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .auth-card p.sub{margin:0 0 22px;color:var(--muted);font-size:13.5px;}

  .tabs{ position:relative; }
  .tab-btn{ transition:transform .15s ease, box-shadow .15s ease; }
  .tab-btn.active{ background:linear-gradient(135deg,var(--auth-blue),var(--auth-purple)); border-color:transparent;
    box-shadow:0 8px 18px rgba(109,63,214,0.35); }
  .tab-btn:hover{ transform:translateY(-1px); }

  input{ transition:box-shadow .15s ease, border-color .15s ease; }
  input:focus{ box-shadow:0 0 0 3px rgba(109,63,214,0.15); border-color:var(--auth-purple); }

  .btn-primary{
    background:linear-gradient(135deg,var(--auth-blue),var(--auth-purple),var(--auth-pink));
    background-size:180% 180%; box-shadow:0 10px 24px rgba(109,63,214,0.35);
    transition:transform .15s ease, box-shadow .15s ease, background-position .4s ease;
  }
  .btn-primary:hover{ background-position:100% 50%; box-shadow:0 14px 30px rgba(109,63,214,0.45); transform:translateY(-1px); }
  .btn-primary:active{ transform:translateY(0) scale(.98); }

  @media (max-width:480px){ .blob{ display:none; } }
</style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="auth-card">
    <h1>Test Portal</h1>
    <p class="sub" id="subtitle">Login to continue</p>

    <div class="tabs">
      <button class="tab-btn active" id="tab-login">Login</button>
      <button class="tab-btn" id="tab-signup">Sign Up</button>
    </div>

    <div id="msg-area"></div>

    <!-- LOGIN FORM -->
    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" required placeholder="••••••••">
      </div>
      <div style="text-align:right;margin:-8px 0 16px;">
        <a href="#" id="forgot-password-link" style="font-size:12.5px;">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Login</button>
    </form>

    <!-- FORGOT PASSWORD FORM -->
    <form id="forgot-form" style="display:none;">
      <p class="sub" style="margin:0 0 16px;">Enter your account email — we'll send you a secure link to set a new password.</p>
      <div class="field">
        <label>Email</label>
        <input type="email" id="forgot-email" required placeholder="you@example.com">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="forgot-btn">Send Reset Link</button>
      <button type="button" class="btn btn-outline btn-block mt-8" id="forgot-back-btn">Back to Login</button>
    </form>

    <!-- SIGNUP FORM -->
    <form id="signup-form" style="display:none;">
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="signup-name" required placeholder="Your name">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="signup-email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="signup-password" required placeholder="Minimum 10 characters" minlength="10">
        <p class="muted" style="font-size:11.5px;margin:5px 0 0;">Use at least 10 characters. Avoid common passwords like "password123".</p>
      </div>
      <div class="field">
        <label>Access Passcode</label>
        <input type="text" id="signup-passcode" required placeholder="Ask your admin for this code">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="signup-btn">Create Account</button>
    </form>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="lib/supabaseClient.js"></script>
<script>
const tabLogin = document.getElementById('tab-login');
const tabSignup = document.getElementById('tab-signup');
const loginForm = document.getElementById('login-form');
const signupForm = document.getElementById('signup-form');
const forgotForm = document.getElementById('forgot-form');
const subtitle = document.getElementById('subtitle');
const msgArea = document.getElementById('msg-area');

function showLogin(){
  tabLogin.classList.add('active'); tabSignup.classList.remove('active');
  loginForm.style.display='block'; signupForm.style.display='none'; forgotForm.style.display='none';
  document.querySelector('.tabs').style.display='flex';
  subtitle.textContent='Login to continue'; msgArea.innerHTML='';
}
tabLogin.addEventListener('click', showLogin);
tabSignup.addEventListener('click', () => {
  tabSignup.classList.add('active'); tabLogin.classList.remove('active');
  signupForm.style.display='block'; loginForm.style.display='none'; forgotForm.style.display='none';
  subtitle.textContent='Create your account with the access passcode'; msgArea.innerHTML='';
});

document.getElementById('forgot-password-link').addEventListener('click', (e) => {
  e.preventDefault();
  document.querySelector('.tabs').style.display='none';
  loginForm.style.display='none'; signupForm.style.display='none'; forgotForm.style.display='block';
  subtitle.textContent='Reset your password'; msgArea.innerHTML='';
});
document.getElementById('forgot-back-btn').addEventListener('click', showLogin);

forgotForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  msgArea.innerHTML='';
  const btn = document.getElementById('forgot-btn');
  btn.disabled = true; btn.textContent = 'Sending...';
  const email = document.getElementById('forgot-email').value.trim();

  const redirectTo = window.location.origin + window.location.pathname.replace(/login\.html$/, '') + 'reset-password.html';
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });

  btn.disabled = false; btn.textContent = 'Send Reset Link';
  if(error){ showError(error.message); return; }
  showSuccess("If that email has an account, a reset link has been sent. Check your inbox (and spam folder).");
});

function showError(msg){ msgArea.innerHTML = `<div class="error-msg">${msg}</div>`; }
function showSuccess(msg){ msgArea.innerHTML = `<div class="success-msg">${msg}</div>`; }

async function redirectByRole(){
  const profile = await getCurrentProfile();
  if(profile && profile.role === 'admin'){
    window.location.href = 'admin/dashboard.html';
  } else {
    window.location.href = 'student/dashboard.html';
  }
}

// If already logged in, skip straight to the right dashboard
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(session) redirectByRole();
})();

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  msgArea.innerHTML='';
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Logging in...';
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(!error){ await supabaseClient.rpc('register_device_session', { p_device_id: getDeviceId() }); }
  btn.disabled = false; btn.textContent = 'Login';
  if(error){ showError(error.message); return; }
  await redirectByRole();
});

signupForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  msgArea.innerHTML='';
  const btn = document.getElementById('signup-btn');
  btn.disabled = true; btn.textContent = 'Creating account...';

  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  const passcode = document.getElementById('signup-passcode').value.trim();

  // 0. Basic password strength / common-password guard (client-side first line of defense —
  // Supabase Auth settings should also have "leaked password protection" enabled for full coverage)
  const COMMON_PASSWORDS = ['password','password1','password123','12345678','123456789','1234567890',
    'qwertyui','qwerty123','iloveyou','letmein11','admin1234','welcome123','abc123456','passw0rd','123123123'];
  if(COMMON_PASSWORDS.includes(password.toLowerCase())){
    btn.disabled=false; btn.textContent='Create Account';
    showError('That password is too common and easily guessed. Please choose a stronger one.');
    return;
  }
  if(/^[0-9]+$/.test(password) || /^[a-zA-Z]+$/.test(password)){
    btn.disabled=false; btn.textContent='Create Account';
    showError('Use a mix of letters and numbers in your password for better security.');
    return;
  }

  // 1. Check passcode
  const { data: settings, error: settingsErr } = await supabaseClient
    .from('app_settings').select('signup_passcode').eq('id', 1).single();

  if(settingsErr){ btn.disabled=false; btn.textContent='Create Account'; showError('Could not verify passcode. Check your Supabase setup.'); return; }
  if(!settings || settings.signup_passcode !== passcode){
    btn.disabled=false; btn.textContent='Create Account';
    showError('Incorrect passcode. Ask your admin for the correct one.');
    return;
  }

  // 2. Create auth user
  const { data: signUpData, error: signUpErr } = await supabaseClient.auth.signUp({ email, password });
  if(signUpErr){ btn.disabled=false; btn.textContent='Create Account'; showError(signUpErr.message); return; }

  // 3. Create profile row (id must match auth.uid())
  const userId = signUpData.user ? signUpData.user.id : (signUpData.session ? signUpData.session.user.id : null);
  if(userId){
    await supabaseClient.from('profiles').insert({ id: userId, email, name, role: 'student' });
  }

  btn.disabled = false; btn.textContent = 'Create Account';

  if(!signUpData.session){
    showSuccess('Account created! Check your email to confirm, then login.');
    tabLogin.click();
  } else {
    await supabaseClient.rpc('register_device_session', { p_device_id: getDeviceId() });
    await redirectByRole();
  }
});
</script>
</body>
</html>
