<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Test Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  :root{ --auth-navy:#0a0e1a; --auth-blue1:#101d33; --auth-blue2:#1c3252; --auth-blue3:#2c4a75; }
  body{
    display:flex;align-items:center;justify-content:center;min-height:100vh;
    padding:20px;font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#05070d 0%,#0e1526 45%,#1c3252 100%);
    position:relative; overflow:hidden;
  }
  .blob{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.45; z-index:0; }
  .blob1{ width:420px;height:420px; background:var(--auth-blue3); top:-120px; left:-100px; animation:float1 11s ease-in-out infinite; }
  .blob2{ width:380px;height:380px; background:var(--auth-blue2); bottom:-140px; right:-100px; animation:float2 13s ease-in-out infinite; }
  @keyframes float1{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(40px,50px) scale(1.08); } }
  @keyframes float2{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-35px,-30px) scale(1.1); } }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(28px) scale(.96); } to{ opacity:1; transform:translateY(0) scale(1); } }
  .auth-card{
    position:relative; z-index:1;
    background:rgba(255,255,255,0.97); backdrop-filter:blur(6px);
    border-radius:22px;max-width:420px;width:100%;padding:36px 32px;
    box-shadow:0 30px 70px rgba(5,8,20,0.45);
    animation:cardIn .6s cubic-bezier(.2,.8,.2,1) both;
  }
  .auth-card h1{
    margin:0 0 4px;font-size:24px;font-weight:800;
    background:linear-gradient(135deg,var(--auth-blue1),var(--auth-blue3));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .auth-card p.sub{margin:0 0 22px;color:var(--muted);font-size:13.5px;}
  input{ transition:box-shadow .15s ease, border-color .15s ease; }
  input:focus{ box-shadow:0 0 0 3px rgba(44,74,117,0.18); border-color:var(--auth-blue3); }
  .btn-primary{
    background:linear-gradient(135deg,var(--auth-navy),var(--auth-blue2),var(--auth-blue3));
    background-size:180% 180%; box-shadow:0 10px 24px rgba(16,29,51,0.4);
    transition:transform .15s ease, box-shadow .15s ease, background-position .4s ease;
  }
  .btn-primary:hover{ background-position:100% 50%; box-shadow:0 14px 30px rgba(16,29,51,0.5); transform:translateY(-1px); }
  @media (max-width:480px){ .blob{ display:none; } }
</style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="auth-card">
    <h1>Set a New Password</h1>
    <p class="sub" id="subtitle">Choose a new password for your account.</p>
    <div id="msg-area"></div>

    <form id="reset-form">
      <div class="field">
        <label>New Password</label>
        <input type="password" id="new-password" required minlength="10" placeholder="Minimum 10 characters">
        <p class="muted" style="font-size:11.5px;margin:5px 0 0;">Use at least 10 characters with a mix of letters and numbers.</p>
      </div>
      <div class="field">
        <label>Confirm New Password</label>
        <input type="password" id="confirm-password" required minlength="10" placeholder="Re-enter password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="reset-btn">Update Password</button>
    </form>

    <div id="success-area" style="display:none;text-align:center;">
      <p style="color:var(--green-dark);font-weight:600;">Password updated! You can now log in.</p>
      <a href="login.html" class="btn btn-primary btn-block">Go to Login</a>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="lib/supabaseClient.js"></script>
<script>
const msgArea = document.getElementById('msg-area');
function showError(msg){ msgArea.innerHTML = `<div class="error-msg">${msg}</div>`; }

// Supabase automatically picks up the recovery token from the URL fragment
// (#access_token=...&type=recovery) and creates a temporary session for it.
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session){
    showError('This reset link is invalid or has expired. Please request a new one from the login page.');
    document.getElementById('reset-form').style.display = 'none';
  }
})();

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  msgArea.innerHTML = '';
  const pw1 = document.getElementById('new-password').value;
  const pw2 = document.getElementById('confirm-password').value;

  if(pw1 !== pw2){ showError("Passwords don't match."); return; }

  const btn = document.getElementById('reset-btn');
  btn.disabled = true; btn.textContent = 'Updating...';

  const { error } = await supabaseClient.auth.updateUser({ password: pw1 });

  btn.disabled = false; btn.textContent = 'Update Password';
  if(error){ showError(error.message); return; }

  document.getElementById('reset-form').style.display = 'none';
  document.getElementById('success-area').style.display = 'block';
});
</script>
</body>
</html>
