<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Test Portal</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;
    background:linear-gradient(135deg,var(--primary) 0%,#4c5fd6 100%);padding:20px;}
  .auth-card{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:34px 30px;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  .auth-card h1{margin:0 0 4px;font-size:22px;}
  .auth-card p.sub{margin:0 0 22px;color:var(--muted);font-size:13.5px;}
</style>
</head>
<body>
  <div class="auth-card">
    <h1>Set a New Password</h1>
    <p class="sub" id="subtitle">Choose a new password for your account.</p>
    <div id="msg-area"></div>

    <form id="reset-form">
      <div class="field">
        <label>New Password</label>
        <input type="password" id="new-password" required minlength="6" placeholder="Minimum 6 characters">
      </div>
      <div class="field">
        <label>Confirm New Password</label>
        <input type="password" id="confirm-password" required minlength="6" placeholder="Re-enter password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="reset-btn">Update Password</button>
    </form>

    <div id="success-area" style="display:none;text-align:center;">
      <p style="color:var(--green-dark);font-weight:600;">Password updated! You can now log in.</p>
      <a href="login.html" class="btn btn-primary btn-block">Go to Login</a>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="lib/supabaseClient.js"></script>
<script>
const msgArea = document.getElementById('msg-area');
function showError(msg){ msgArea.innerHTML = `<div class="error-msg">${msg}</div>`; }

// Supabase automatically picks up the recovery token from the URL fragment
// (#access_token=...&type=recovery) and creates a temporary session for it.
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session){
    showError('This reset link is invalid or has expired. Please request a new one from the login page.');
    document.getElementById('reset-form').style.display = 'none';
  }
})();

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  msgArea.innerHTML = '';
  const pw1 = document.getElementById('new-password').value;
  const pw2 = document.getElementById('confirm-password').value;

  if(pw1 !== pw2){ showError("Passwords don't match."); return; }

  const btn = document.getElementById('reset-btn');
  btn.disabled = true; btn.textContent = 'Updating...';

  const { error } = await supabaseClient.auth.updateUser({ password: pw1 });

  btn.disabled = false; btn.textContent = 'Update Password';
  if(error){ showError(error.message); return; }

  document.getElementById('reset-form').style.display = 'none';
  document.getElementById('success-area').style.display = 'block';
});
</script>
</body>
</html>
