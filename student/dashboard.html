<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  :root{ --stu-blue:#4f6cf7; --stu-purple:#8b5cf6; --stu-pink:#ec4899; --stu-mint:#22d3ee; }
  body{ font-family:'Poppins',sans-serif; background:#f4f5fb; }

  @keyframes fadeInUp{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes floatBg{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }

  .topnav{
    background:linear-gradient(120deg,#4338ca 0%,#7c3aed 55%,#db2777 100%);
    box-shadow:0 6px 24px rgba(99,49,222,0.25); position:relative; overflow:hidden;
  }
  .topnav::after{ content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 90% -30%, rgba(34,211,238,0.25), transparent 55%); pointer-events:none; }

  .tabs{ gap:8px; }
  .tab-btn{ border-radius:12px; font-weight:600; transition:transform .18s ease, box-shadow .18s ease; animation:fadeInUp .4s ease both; }
  .tab-btn:hover{ transform:translateY(-2px); box-shadow:0 8px 16px rgba(99,49,222,0.14); }
  .tab-btn.active{
    background:linear-gradient(135deg,var(--stu-blue),var(--stu-purple));
    border-color:transparent; color:#fff; box-shadow:0 10px 22px rgba(99,49,222,0.35);
  }
  .tabs .tab-btn:nth-child(1){animation-delay:.03s;} .tabs .tab-btn:nth-child(2){animation-delay:.08s;} .tabs .tab-btn:nth-child(3){animation-delay:.13s;}

  .test-card{display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;
    border:none; animation:fadeInUp .5s cubic-bezier(.2,.8,.2,1) both;
    transition:transform .2s ease, box-shadow .2s ease;}
  .test-card::before{ content:''; position:absolute; top:-40px; right:-40px; width:120px;height:120px;border-radius:50%;
    background:linear-gradient(135deg,var(--stu-blue),var(--stu-pink)); opacity:.10; }
  .test-card:hover{ transform:translateY(-4px); box-shadow:0 16px 34px rgba(80,60,200,0.16); }
  #tests-grid .shadow-card:nth-child(1){animation-delay:.04s;} #tests-grid .shadow-card:nth-child(2){animation-delay:.09s;}
  #tests-grid .shadow-card:nth-child(3){animation-delay:.14s;} #tests-grid .shadow-card:nth-child(4){animation-delay:.19s;}

  .test-card .name{font-weight:800;font-size:16px;}
  .test-card .meta{font-size:12.5px;color:var(--muted);}
  .result-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;
    border-bottom:1px solid var(--border);font-size:13.5px;}
  .result-row:last-child{border-bottom:none;}
  .pdf-card{display:flex;flex-direction:column;gap:10px;animation:fadeInUp .5s ease both;
    transition:transform .2s ease, box-shadow .2s ease;}
  .pdf-card:hover{ transform:translateY(-4px); box-shadow:0 16px 34px rgba(80,60,200,0.16); }
  .pdf-card .name{font-weight:800;font-size:15px;}
  .pdf-card .meta{font-size:12px;color:var(--muted);}
  .pdf-actions{display:flex;gap:8px;}
  .pdf-modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,18,32,0.7);z-index:60;
    align-items:center;justify-content:center;padding:20px;}
  .pdf-modal-overlay.show{display:flex;}
  .pdf-modal{background:#fff;border-radius:16px;width:100%;max-width:900px;height:85vh;
    display:flex;flex-direction:column;overflow:hidden; animation:fadeInUp .3s ease both;}
  .pdf-modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;
    border-bottom:1px solid var(--border);}
  .pdf-modal-head button{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}
  .pdf-modal iframe{flex:1;border:none;width:100%;}

  .shadow-card{ box-shadow:0 2px 8px rgba(60,40,140,0.05), 0 10px 26px rgba(60,40,140,0.06); border:1px solid var(--border); }
  .btn-primary{
    background:linear-gradient(135deg,var(--stu-blue),var(--stu-purple));
    box-shadow:0 8px 18px rgba(99,49,222,0.3); transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 12px 24px rgba(99,49,222,0.4); }
  .badge-purple{ background:linear-gradient(135deg,#ede9fe,#fce7f3); color:#7c3aed; }
</style>
</head>
<body>
  <div class="topnav">
    <div class="brand">Test Portal <span id="user-name-label">Loading...</span></div>
    <div class="nav-actions" style="gap:10px;align-items:center;">
      <span class="pill" id="admin-preview-badge" style="display:none;">👁 Admin Preview Mode</span>
      <a href="../admin/dashboard.html" id="admin-preview-link" class="btn btn-outline btn-sm" style="display:none;">Back to Admin Panel</a>
      <button class="btn btn-outline btn-sm" id="logout-btn">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" id="tab-tests">Available Tests</button>
      <button class="tab-btn" id="tab-results">My Results</button>
      <button class="tab-btn" id="tab-resources">Study Material</button>
    </div>

    <div id="tests-panel">
      <div class="grid grid-3" id="tests-grid">
        <p class="muted">Loading tests...</p>
      </div>
    </div>

    <div id="results-panel" style="display:none;">
      <div class="shadow-card" id="results-list">
        <p class="muted">Loading results...</p>
      </div>
    </div>

    <div id="resources-panel" style="display:none;">
      <div class="grid grid-3" id="resources-grid">
        <p class="muted">Loading study material...</p>
      </div>
    </div>
  </div>

  <div class="pdf-modal-overlay" id="pdf-modal-overlay">
    <div class="pdf-modal">
      <div class="pdf-modal-head">
        <b id="pdf-modal-title">PDF</b>
        <button id="pdf-modal-close">✕</button>
      </div>
      <iframe id="pdf-modal-iframe" src=""></iframe>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="../lib/supabaseClient.js"></script>
<script>
let profile;

(async () => {
  const session = await requireLogin();
  if(!session) return;
  profile = await getCurrentProfile();
  startMaintenancePolling(profile); // shows/hides the 503 overlay live, right on this page
  document.getElementById('user-name-label').textContent = `— ${profile?.name || profile?.email || ''}`;
  if(profile && profile.role === 'admin'){
    document.getElementById('admin-preview-badge').style.display = 'inline-block';
    document.getElementById('admin-preview-link').style.display = 'inline-block';
  }
  loadTests();
})();

document.getElementById('logout-btn').addEventListener('click', () => logout());

const allTabs = ['tests','results','resources'];
function showTab(name){
  allTabs.forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('active', t===name);
    document.getElementById(`${t}-panel`).style.display = (t===name) ? 'block' : 'none';
  });
  if(name==='results') loadResults();
  if(name==='resources') loadResources();
}
document.getElementById('tab-tests').addEventListener('click', () => showTab('tests'));
document.getElementById('tab-results').addEventListener('click', () => showTab('results'));
document.getElementById('tab-resources').addEventListener('click', () => showTab('resources'));

async function loadResources(){
  const grid = document.getElementById('resources-grid');
  const { data, error } = await supabaseClient
    .from('resources').select('*, tests(name)').order('created_at', { ascending:false });
  if(error){ grid.innerHTML = `<p class="error-msg">Could not load study material: ${error.message}</p>`; return; }
  if(!data || data.length===0){ grid.innerHTML = `<p class="muted">No study material added yet.</p>`; return; }

  grid.innerHTML = '';
  data.forEach(r => {
    const div = document.createElement('div');
    div.className = 'shadow-card pdf-card';
    div.innerHTML = `
      <div class="name">📄 ${r.title}</div>
      <div class="meta">${r.tests?.name ? 'For: ' + r.tests.name : 'General'}</div>
      <div class="pdf-actions">
        <button class="btn btn-primary btn-sm">Preview</button>
        <a class="btn btn-outline btn-sm" href="${toPdfDownloadUrl(r.url)}" target="_blank" download>Download</a>
      </div>
    `;
    div.querySelector('button').addEventListener('click', () => openPdfPreview(r.title, r.url));
    grid.appendChild(div);
  });
}

function openPdfPreview(title, url){
  document.getElementById('pdf-modal-title').textContent = title;
  document.getElementById('pdf-modal-iframe').src = toPdfPreviewUrl(url);
  document.getElementById('pdf-modal-overlay').classList.add('show');
}
document.getElementById('pdf-modal-close').addEventListener('click', () => {
  document.getElementById('pdf-modal-overlay').classList.remove('show');
  document.getElementById('pdf-modal-iframe').src = '';
});
document.getElementById('pdf-modal-overlay').addEventListener('click', (e) => {
  if(e.target.id === 'pdf-modal-overlay'){
    document.getElementById('pdf-modal-overlay').classList.remove('show');
    document.getElementById('pdf-modal-iframe').src = '';
  }
});

async function loadTests(){
  const grid = document.getElementById('tests-grid');
  const { data: tests, error } = await supabaseClient
    .from('tests').select('*').eq('is_active', true).order('created_at', { ascending: false });

  if(error){ grid.innerHTML = `<p class="error-msg">Could not load tests: ${error.message}</p>`; return; }
  if(!tests || tests.length===0){ grid.innerHTML = `<p class="muted">No tests available yet. Check back later.</p>`; return; }

  grid.innerHTML = '';
  tests.forEach(t => {
    const h = Math.floor(t.duration_ms/3600000);
    const m = Math.round((t.duration_ms%3600000)/60000);
    const div = document.createElement('div');
    div.className = 'shadow-card test-card';
    div.innerHTML = `
      <div class="name">${t.name}</div>
      <div class="meta">Duration: ${h>0?h+'h ':''}${m}m</div>
      <button class="btn btn-primary btn-sm" style="align-self:flex-start;">Start Test</button>
    `;
    div.querySelector('button').addEventListener('click', () => {
      window.location.href = `test.html?test_id=${t.id}`;
    });
    grid.appendChild(div);
  });
}

async function loadResults(){
  const wrap = document.getElementById('results-list');
  const { data: results, error } = await supabaseClient
    .from('results')
    .select('*, tests(name)')
    .order('submitted_at', { ascending: false });

  if(error){ wrap.innerHTML = `<p class="error-msg">Could not load results: ${error.message}</p>`; return; }
  if(!results || results.length===0){ wrap.innerHTML = `<p class="muted">You haven't attempted any tests yet.</p>`; return; }

  wrap.innerHTML = results.map(r => `
    <div class="result-row">
      <div>
        <b>${r.tests?.name || 'Test'}</b><br>
        <span class="muted">${new Date(r.submitted_at).toLocaleString()}</span>
      </div>
      <div style="text-align:right;">
        <span class="badge badge-purple">Score: ${r.total_score}</span><br>
        <span class="muted" style="font-size:11.5px;">✓${r.total_correct} · ✗${r.total_incorrect} · –${r.total_unattempted}</span>
      </div>
    </div>
  `).join('');
}
</script>
</body>
</html>
